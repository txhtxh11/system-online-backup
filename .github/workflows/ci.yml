name: ci

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    name: bash -n
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 语法检查
        run: |
          set -euo pipefail
          for f in $(git ls-files '*.sh'); do
            echo "== $f"
            bash -n "$f"
          done

      - name: shellcheck（仅提示，不阻塞）
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck -S warning system-online-backup.sh || true
